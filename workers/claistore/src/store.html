<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClaiStore</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

  :root {
    --bg-0: #061015;
    --bg-1: #0d1a27;
    --surface-0: rgba(14, 25, 37, 0.86);
    --surface-1: rgba(18, 35, 52, 0.92);
    --surface-2: rgba(255, 255, 255, 0.04);
    --stroke-soft: rgba(100, 210, 255, 0.2);
    --stroke-strong: rgba(100, 210, 255, 0.42);
    --text-0: #eff8ff;
    --text-1: #bfd6e8;
    --text-2: #88a0b5;
    --accent: #64d2ff;
    --accent-2: #47e6bc;
    --ok: #49db9c;
    --warn: #ffbd75;
    --danger: #ff7a8f;
    --radius-lg: 20px;
    --radius-md: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Sora', 'Avenir Next', 'Segoe UI', sans-serif;
    min-height: 100vh;
    color: var(--text-0);
    background:
      radial-gradient(1000px 640px at 93% -4%, rgba(100, 210, 255, 0.2), transparent 68%),
      radial-gradient(780px 520px at 2% 0%, rgba(71, 230, 188, 0.17), transparent 72%),
      linear-gradient(160deg, var(--bg-1), var(--bg-0));
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(190, 225, 255, 0.048) 1px, transparent 1px),
      linear-gradient(90deg, rgba(190, 225, 255, 0.048) 1px, transparent 1px);
    background-size: 34px 34px;
    mask-image: radial-gradient(circle at center, black 35%, transparent 94%);
    opacity: 0.5;
    z-index: 0;
  }

  .main {
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
    padding: 2.1rem 2.25rem;
    position: relative;
    z-index: 1;
    animation: rise-in 0.44s ease;
  }

  .hero {
    background: linear-gradient(145deg, rgba(100, 210, 255, 0.15), rgba(9, 18, 32, 0.74));
    border: 1px solid var(--stroke-soft);
    border-radius: var(--radius-lg);
    padding: 1.25rem 1.3rem;
    margin-bottom: 1.08rem;
    box-shadow: 0 22px 42px rgba(4, 12, 23, 0.36);
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0.9rem;
    align-items: center;
  }

  .hero h1 {
    font-family: 'Space Grotesk', 'Sora', sans-serif;
    font-size: clamp(1.32rem, 2.6vw, 1.9rem);
    letter-spacing: 0.01em;
    margin-bottom: 0.28rem;
  }

  .hero p {
    color: var(--text-1);
    font-size: 0.9rem;
    max-width: 780px;
    line-height: 1.45;
  }

  .hero-meta {
    display: flex;
    gap: 0.55rem;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .pill {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.085em;
    font-weight: 700;
    padding: 0.38rem 0.64rem;
    border-radius: 999px;
    border: 1px solid rgba(100, 210, 255, 0.44);
    color: #d8f5ff;
    background: rgba(100, 210, 255, 0.16);
  }

  .pill.subtle {
    color: var(--text-2);
    border-color: rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.04);
  }

  .board {
    display: grid;
    grid-template-columns: minmax(0, 1.3fr) minmax(280px, 0.7fr);
    gap: 0.95rem;
    align-items: start;
  }

  .panel {
    background: linear-gradient(165deg, var(--surface-1), var(--surface-0));
    border: 1px solid var(--stroke-soft);
    border-radius: var(--radius-lg);
    padding: 1rem;
    box-shadow: 0 14px 34px rgba(3, 10, 20, 0.3);
  }

  .panel-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.7rem;
    margin-bottom: 0.85rem;
  }

  .panel-title h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-2);
  }

  .small-note {
    font-size: 0.72rem;
    color: var(--text-2);
  }

  .tool-list { display: grid; gap: 0.72rem; }

  .tool-card {
    border: 1px solid rgba(100, 210, 255, 0.18);
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.02));
    border-radius: var(--radius-md);
    padding: 0.86rem;
    display: grid;
    gap: 0.52rem;
  }

  .tool-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.7rem;
  }

  .tool-name {
    font-family: 'Space Grotesk', 'Sora', sans-serif;
    font-size: 0.96rem;
    color: var(--text-0);
    font-weight: 600;
  }

  .tool-kind {
    font-size: 0.63rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #d6f8ee;
    border: 1px solid rgba(71, 230, 188, 0.45);
    background: rgba(71, 230, 188, 0.16);
    border-radius: 999px;
    padding: 0.22rem 0.5rem;
    font-weight: 700;
  }

  .tool-desc {
    color: var(--text-1);
    font-size: 0.8rem;
    line-height: 1.4;
  }

  .tool-meta {
    color: var(--text-2);
    font-size: 0.72rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.58rem;
  }

  .tool-actions {
    display: flex;
    justify-content: flex-end;
    align-items: center;
  }

  .btn {
    border: 1px solid rgba(100, 210, 255, 0.34);
    background: linear-gradient(145deg, rgba(100, 210, 255, 0.22), rgba(71, 230, 188, 0.11));
    color: var(--text-0);
    padding: 0.52rem 0.82rem;
    border-radius: 10px;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn:hover {
    border-color: var(--stroke-strong);
    transform: translateY(-1px);
    box-shadow: 0 10px 20px rgba(8, 20, 35, 0.36);
  }

  .btn.secondary {
    border-color: rgba(255, 255, 255, 0.16);
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-1);
  }

  .empty {
    border: 1px dashed rgba(255, 255, 255, 0.2);
    border-radius: var(--radius-md);
    padding: 1rem;
    color: var(--text-2);
    text-align: center;
    font-size: 0.82rem;
    background: rgba(255, 255, 255, 0.02);
  }

  .upload-form { display: grid; gap: 0.65rem; }

  .field { display: grid; gap: 0.34rem; }

  .field label {
    font-size: 0.72rem;
    color: var(--text-2);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 700;
  }

  .field input,
  .field select,
  .field textarea {
    width: 100%;
    border: 1px solid rgba(100, 210, 255, 0.18);
    border-radius: 10px;
    background: rgba(3, 8, 15, 0.34);
    color: var(--text-0);
    font-family: 'Sora', sans-serif;
    font-size: 0.84rem;
    padding: 0.58rem 0.68rem;
    outline: none;
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }

  .field textarea { resize: vertical; min-height: 88px; line-height: 1.4; }

  .field input:focus,
  .field select:focus,
  .field textarea:focus {
    border-color: rgba(100, 210, 255, 0.5);
    box-shadow: 0 0 0 3px rgba(100, 210, 255, 0.18);
  }

  .upload-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.8rem;
    flex-wrap: wrap;
    font-size: 0.72rem;
    color: var(--text-2);
  }

  .msg { min-height: 1.2em; font-size: 0.76rem; }
  .msg.ok { color: var(--ok); }
  .msg.err { color: var(--danger); }

  .auth-bar {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    margin-bottom: 0.8rem;
  }

  .auth-bar input {
    flex: 1;
    border: 1px solid rgba(100, 210, 255, 0.18);
    border-radius: 10px;
    background: rgba(3, 8, 15, 0.34);
    color: var(--text-0);
    font-family: 'Sora', sans-serif;
    font-size: 0.78rem;
    padding: 0.45rem 0.6rem;
    outline: none;
  }

  @keyframes rise-in {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 1020px) {
    .board { grid-template-columns: 1fr; }
  }

  @media (max-width: 768px) {
    .main { padding: 1rem 0.85rem; }
    .hero { grid-template-columns: 1fr; }
    .hero-meta { justify-content: flex-start; }
  }
</style>
</head>
<body>

<main class="main">
  <header class="hero">
    <div>
      <h1>ClaiStore</h1>
      <p>Browse and share custom tools and skills. Download packages or install them on your TALOS server.</p>
    </div>
    <div class="hero-meta">
      <span class="pill" id="tool-count">Loading</span>
      <span class="pill subtle">Max upload 10 MB</span>
    </div>
  </header>

  <section class="board">
    <section class="panel">
      <div class="panel-title">
        <h2>ClaiStore Packages</h2>
        <button class="btn secondary" onclick="loadItems()">Refresh</button>
      </div>
      <div class="tool-list" id="tool-list"></div>
    </section>

    <section class="panel">
      <div class="panel-title">
        <h2>Upload Yours</h2>
      </div>
      <div class="auth-bar">
        <input type="password" id="auth-token" placeholder="Upload token (if required)">
      </div>
      <form class="upload-form" id="upload-form">
        <div class="field">
          <label for="item-name">Title</label>
          <input id="item-name" name="name" type="text" placeholder="Smart Spreadsheet Skill" maxlength="120" required>
        </div>
        <div class="field">
          <label for="item-kind">Type</label>
          <select id="item-kind" name="kind">
            <option value="tool">Tool</option>
            <option value="skill">Skill</option>
            <option value="bundle">Bundle</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="field">
          <label for="item-author">Author</label>
          <input id="item-author" name="author" type="text" placeholder="your name or handle" maxlength="120">
        </div>
        <div class="field">
          <label for="item-description">Description</label>
          <textarea id="item-description" name="description" maxlength="360" placeholder="What does it do and when should people use it?"></textarea>
        </div>
        <div class="field">
          <label for="item-file">Package File</label>
          <input id="item-file" name="file" type="file" required>
        </div>
        <div class="upload-meta">
          <span>Allowed: .zip .json .md .txt .yaml .yml .toml .py</span>
          <button type="submit" class="btn" id="upload-btn">Upload to ClaiStore</button>
        </div>
      </form>
      <div class="msg" id="upload-msg"></div>
    </section>
  </section>
</main>

<script>
var state = { items: [] };

function esc(value) {
  var d = document.createElement('div');
  d.textContent = value == null ? '' : String(value);
  return d.innerHTML;
}

function formatBytes(bytes) {
  var value = Number(bytes || 0);
  if (!Number.isFinite(value) || value <= 0) return '0 B';
  var units = ['B', 'KB', 'MB', 'GB'];
  var idx = Math.min(Math.floor(Math.log(value) / Math.log(1024)), units.length - 1);
  var amount = value / Math.pow(1024, idx);
  var precision = idx === 0 ? 0 : 1;
  return amount.toFixed(precision) + ' ' + units[idx];
}

function formatDate(iso) {
  if (!iso) return 'unknown date';
  var d = new Date(iso);
  if (Number.isNaN(d.getTime())) return 'unknown date';
  return d.toLocaleString();
}

function setUploadMsg(text, ok) {
  var msg = document.getElementById('upload-msg');
  msg.textContent = text || '';
  msg.className = 'msg ' + (ok ? 'ok' : 'err');
}

function getAuthHeader() {
  var token = document.getElementById('auth-token').value.trim();
  return token ? { 'Authorization': 'Bearer ' + token } : {};
}

function renderList() {
  var host = document.getElementById('tool-list');
  var count = document.getElementById('tool-count');
  count.textContent = state.items.length + ' package' + (state.items.length === 1 ? '' : 's');

  if (!state.items.length) {
    host.innerHTML = '<div class="empty">No packages yet. Be the first to share a tool or skill.</div>';
    return;
  }

  host.innerHTML = state.items.map(function(item) {
    var description = item.description ? esc(item.description) : 'No description provided.';
    var author = item.author ? esc(item.author) : 'anonymous';
    var kind = esc(item.kind || 'tool');
    var name = esc(item.name || item.file_name || 'Untitled');
    var meta = 'By ' + author + ' | ' + formatBytes(item.size_bytes) + ' | ' + formatDate(item.uploaded_at) + ' | Downloads: ' + Number(item.downloads || 0);

    return '<article class="tool-card">'
      + '<div class="tool-head">'
      + '<div class="tool-name">' + name + '</div>'
      + '<span class="tool-kind">' + kind + '</span>'
      + '</div>'
      + '<div class="tool-desc">' + description + '</div>'
      + '<div class="tool-meta"><span>' + esc(meta) + '</span></div>'
      + '<div class="tool-actions">'
      + '<button class="btn" onclick="downloadItem(\'' + esc(item.id) + '\')">Download</button>'
      + '</div>'
      + '</article>';
  }).join('');
}

async function loadItems() {
  try {
    var res = await fetch('/api/items');
    var data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Failed to load');
    state.items = Array.isArray(data.items) ? data.items : [];
    renderList();
  } catch (e) {
    setUploadMsg(e && e.message ? e.message : 'Could not load packages.', false);
  }
}

function toDataUrl(file) {
  return new Promise(function(resolve, reject) {
    var reader = new FileReader();
    reader.onload = function() { resolve(String(reader.result || '')); };
    reader.onerror = function() { reject(new Error('Failed to read file')); };
    reader.readAsDataURL(file);
  });
}

async function uploadItem(event) {
  event.preventDefault();
  var form = document.getElementById('upload-form');
  var submitBtn = document.getElementById('upload-btn');
  var fileInput = document.getElementById('item-file');
  var file = fileInput.files && fileInput.files[0];

  if (!file) { setUploadMsg('Choose a file first.', false); return; }
  if (file.size > 10 * 1024 * 1024) { setUploadMsg('File too large. Limit is 10 MB.', false); return; }

  submitBtn.disabled = true;
  setUploadMsg('Uploading...', true);

  try {
    var dataUrl = await toDataUrl(file);
    var payload = {
      name: document.getElementById('item-name').value,
      kind: document.getElementById('item-kind').value,
      author: document.getElementById('item-author').value,
      description: document.getElementById('item-description').value,
      attachment: { name: file.name, data_url: dataUrl }
    };

    var res = await fetch('/api/items', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, getAuthHeader()),
      body: JSON.stringify(payload)
    });

    var data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'Upload failed');

    setUploadMsg('Uploaded successfully.', true);
    form.reset();
    await loadItems();
  } catch (e) {
    setUploadMsg(e && e.message ? e.message : 'Upload failed.', false);
  } finally {
    submitBtn.disabled = false;
  }
}

function downloadItem(id) {
  var itemId = String(id || '').trim();
  if (!itemId) return;
  window.location.href = '/api/items/' + encodeURIComponent(itemId) + '/download';
}

document.getElementById('upload-form').addEventListener('submit', uploadItem);
loadItems();
</script>
</body>
</html>
